# Python distribution-to-import mapping for the KTD17 distribution signal.
#
# A top-level import name (a Python identifier, spelled as source writes it)
# maps to the candidate distributions that install it when the import and
# distribution names differ. Names compare under PEP 503 normalization, are
# emitted as declared (the table's spelling when undeclared), and several
# candidates emit as a sorted list, never a guess. Each entry's `fixture`
# names the corpus case that exercises it; the data guards check that the
# case exists and labels the import with these distributions.
#
# The table is hand-curated common mismatches.

