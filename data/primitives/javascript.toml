# JavaScript primitive list: the globalThis ambient module and its aliases,
# closure sections, the classification of every Node builtin
# module across Node 18 to 22, and member entries.

language = "javascript"
runtime_range = "18-22"

[ambient]
module = "globalThis"
aliases = ["window", "self", "global", "top", "parent", "frames", "document.defaultView"]
[ambient.module_members]
"process" = "process"

[closure]
require_equivalents = [
    "require",
    "createRequire",
    "module.createRequire",
    "module.require",
    "require.main.require",
    "process.mainModule.require",
    "module.constructor._load",
    "module.Module._load",
    "process.getBuiltinModule",
]
introspection_roots = [
    "constructor",
    "Object.getPrototypeOf",
    "Reflect.getPrototypeOf",
    "__proto__",
]
introspection_prefixes = [
]
egress_traits = [
]

