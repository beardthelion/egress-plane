# Go standard-library classification. Packages on the deny list
# (the net tree minus its parse-only packages, plus the process,
# code-loading, and runtime-introspection packages) are class =
# "egress" with member-level entries; every other package is inert
# with the justification naming what it can do.
language = "go"
runtime_range = "1.18-1.26"

