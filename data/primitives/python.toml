# Python primitive list: the builtins ambient module, closure
# sections, the classification of every standard library module across
# CPython 3.8 to 3.13, and member entries. Every wholly inert module and
# every inert pattern carries a justification under the member-inert rule.

language = "python"
runtime_range = "3.8-3.13"

[ambient]
module = "builtins"
aliases = ["__builtins__"]

[closure]
require_equivalents = [
    "__import__",
    "builtins.__import__",
    "importlib.import_module",
    "importlib.__import__",
]
introspection_roots = [
    "sys._getframe",
    "sys._current_frames",
    "inspect.currentframe",
]
introspection_prefixes = [
    "tb_",
    "f_",
    "gi_",
    "cr_",
    "ag_",
]
egress_traits = [
]

[[closure.introspection_inert]]
name = "__name__"
justification = "A string naming the object; reaches no other object."
fixture = "python/primitives/must-not-introspection-name"

[[closure.introspection_inert]]
name = "__qualname__"
justification = "A string naming the object; reaches no other object."
fixture = "python/primitives/must-not-introspection-qualname"

[[closure.introspection_inert]]
name = "__doc__"
justification = "The docstring text; reaches no other object."
fixture = "python/primitives/must-not-introspection-doc"

[[closure.introspection_inert]]
name = "__module__"
justification = "A string naming the defining module; the module object itself is not reached."
fixture = "python/primitives/must-not-introspection-module"

[[closure.introspection_inert]]
name = "__class__"
justification = "The class of an object in hand; a chain through it still trips on its next listed name, as ().__class__.__base__ does at __base__."
fixture = "python/primitives/must-not-introspection-class"

[[closure.introspection_inert]]
name = "__init__"
justification = "The initializer of a class or instance in hand, whose code is first-party or classified where it is defined."
fixture = "python/primitives/must-not-introspection-init"

[[closure.introspection_inert]]
name = "__file__"
justification = "A path string."
fixture = "python/primitives/must-not-introspection-file"

[[closure.introspection_inert]]
name = "__version__"
justification = "A version string by convention."
fixture = "python/primitives/must-not-introspection-version"

