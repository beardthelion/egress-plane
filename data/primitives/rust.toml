# Rust primitive list: closure sections, the classification of
# every std top-level module of the pinned toolchain plus the core and alloc
# crate roots, and member entries, including the egress traits and
# types whose naming in any position is a reference.

language = "rust"
runtime_range = "1.97.1"

[closure]
require_equivalents = [
]
introspection_roots = [
]
introspection_prefixes = [
]
egress_traits = [
    "rust:std::net::ToSocketAddrs",
    "rust:std::os::unix::process::CommandExt",
    "rust:std::os::unix::prelude::CommandExt",
    "rust:std::os::windows::process::CommandExt",
    "rust:std::net::TcpStream::from_raw_fd",
    "rust:std::net::TcpListener::from_raw_fd",
    "rust:std::net::UdpSocket::from_raw_fd",
    "rust:std::os::unix::net::UnixStream::from_raw_fd",
    "rust:std::os::unix::net::UnixListener::from_raw_fd",
    "rust:std::os::unix::net::UnixDatagram::from_raw_fd",
    "rust:std::net::TcpStream::from_raw_socket",
    "rust:std::net::TcpListener::from_raw_socket",
    "rust:std::net::UdpSocket::from_raw_socket",
]

