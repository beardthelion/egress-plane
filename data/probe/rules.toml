# `redacted` is a boolean member attribute the enumerator sets when KTD14
# redaction changed the name.
[[rule]]
id = "env.credential"
universes = ["linux.env-names", "macos.env-names"]
class = "escape"
kind = "credential-env"
fixture = "linux/layers/github-actions-runner"

[[rule.any]]
name = { in = ["GITHUB_TOKEN", "ACTIONS_ID_TOKEN_REQUEST_TOKEN", "ACTIONS_RUNTIME_TOKEN", "CI_JOB_TOKEN", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN", "AWS_WEB_IDENTITY_TOKEN_FILE", "GOOGLE_APPLICATION_CREDENTIALS", "AZURE_CLIENT_SECRET", "NPM_TOKEN"] }

[[rule.any]]
