universes = ["linux.fds"]
class = "escape"
kind = "inherited-io-uring"
fixture = "linux/routes/inherited-anon-fds"
match = { label = { in = ["inherited"] }, kind = { in = ["anon"] }, anon-name = { in = ["[io_uring]", "io_uring"] } }

[[rule]]
