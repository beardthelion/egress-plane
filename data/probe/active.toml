# Active-mode limits (KTD21). Allowlist entries parse as IP:port literals
# only; before the refused check, IPv4-mapped, IPv4-compatible, and NAT64
# well-known-prefix addresses are canonicalized to IPv4 so their mapped
# forms are refused like the IPv4 entry. A refused entry records its
# result and creates no socket.
#
# `result` is `refused-metadata-address` for endpoints that could return
# credentials or environment details, `refused-special-address` for
# unspecified, broadcast, and multicast addresses.
#
# Each metadata entry carries a comment with the provider documentation
# it was confirmed against.

[[refused]]
# AWS, GCP, Azure, OCI and others share the link-local metadata address
# 169.254.169.254 inside 169.254.0.0/16; the block is refused whole.
# https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-data-retrieval.html
# https://docs.cloud.google.com/compute/docs/metadata/overview
# https://learn.microsoft.com/en-us/azure/virtual-machines/instance-metadata-service
value = "169.254.0.0/16"
result = "refused-metadata-address"
reason = "link-local block holding the AWS, GCP, Azure, and OCI instance metadata endpoints"

[[refused]]
# AWS IMDS over IPv6.
# https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-data-retrieval.html
value = "fd00:ec2::254"
result = "refused-metadata-address"
reason = "AWS instance metadata over IPv6"

[[refused]]
