# Credential redaction rules (KTD11, R21).
#
# These classes are the whole set. A new class, key, prefix, or pattern lands
# here only together with a test fixture that exercises it
# (crates/egress-core/tests/redaction.rs). Secrets that match none of these
# rules are not recognized and can appear in output.
#
# Every match is replaced by the fixed token `<redacted>`. Redaction runs on
# literals, rendered templates (holes rendered as `{...}` placeholders), env
# defaults, `expr:` text, and blind-spot construct text, before identity and
# before the 120-character truncation.
#
# Fixed classes implemented in code (crates/egress-core/src/redact.rs):
# - URL userinfo: everything between `scheme://` and the last `@` of the
#   authority. URLs parse with the `url` crate; when parsing fails, the span
#   between `scheme://` and the last `@` before the first following `/` is
#   redacted (fail closed).
# - Query and fragment parameters: the value of a `key=value` pair that
#   follows `?`, `&`, or `#` is redacted when its key matches `keys`.
# - Keyed entries: the value of a `key=value` pair (libpq DSNs such as
#   `host=db password=x`, call keywords such as `connect(password="x")`) or
#   a `key: value` entry (dict and object entries, the key bare or quoted,
#   such as `{"X-Api-Key": "x"}` or `{ Authorization: "Bearer x" }`) is
#   redacted when its key matches `keys`. The key starts the text or follows
#   whitespace, `(`, `[`, `{`, `,`, or `;`. The value runs to the end of
#   its entry: quoted runs (including Python prefixed and triple-quoted
#   strings) are skipped whole and brackets nest, so `password="a" + "b"`,
#   `password=os.getenv("X", "b")`, and `auth=HTTPBasicAuth("u", "p")` are
#   redacted whole. At bracket depth 0 the value stops before `,`, `;`, a
#   newline, an unmatched closing bracket, whitespace followed by another
#   `key=` (libpq DSN text), or, for a key opened by a quote that is not
#   closed before the separator (`"Authorization: Token x"`), that quote.
#   Unbalanced input runs to the end of the text (fail closed). `==`, `=>`,
#   and `::` after the key are a comparison, an arrow, and a path, not
#   entries.
# - Token runs: see `token_prefixes`.
# - Provider path secrets: see `path_secrets`.

# Keys whose values are redacted in query strings, fragments, and keyed
# entries. Matching is ASCII case-insensitive, on the whole key or as a
# suffix (`x_token` matches `token`, `X-Api-Key` matches `key`).
# Percent-encoded keys are decoded first.
keys = [
    "token",
    "key",
    "api_key",
    "apikey",
    "secret",
    "password",
    "passwd",
    "pwd",
    "auth",
    "sig",
    "signature",
    "access_token",
    "client_secret",
    "credential",
    "session",
    "authorization",
]

# A token run starts at a token boundary (start of text, or a character that
# is not an ASCII letter or digit) with one of these prefixes (case
# sensitive), and continues over ASCII letters, digits, `_`, `-`, and `.`. At
# least one character must follow the prefix. The boundary rule keeps
# `risk-free` and `keyJar` intact.
token_prefixes = [
    "ghp_",
    "github_pat_",
    "glpat-",
    "sk-",
    "sk_live_",
    "AKIA",
    "AIza",
    "xoxb-",
    "xoxp-",
    "npm_",
    "pypi-",
    "eyJ",
]

# Provider path secrets and other patterned secrets. Each pattern is a Rust `regex` with one named group
# `secret`; the text that group matches becomes `<redacted>`. Secret
# character classes exclude `{` and `}` so a symbolic template hole such as
# `{env:SLACK_PATH}` stays readable, and exclude `<` and `>` so the rules are
# idempotent.

# Telegram bot API: `/bot<id>:<token>/method`. The whole `<id>:<token>` pair
# is the credential, so both parts are redacted and the method is kept.
[[path_secrets]]
name = "telegram-bot-token"
pattern = '''/bot(?P<secret>[0-9]+:[A-Za-z0-9_-]+)'''

# Slack incoming webhooks: everything after `/services/` (workspace, channel,
# and secret segments together form the credential).
[[path_secrets]]
name = "slack-webhook"
pattern = '''(?i:hooks\.slack\.com)/services/(?P<secret>[^?#\s"'`{}<>]+)'''

# Discord webhooks: `/api[/vN]/webhooks/<id>/<token>`. The numeric id is kept
# and the token segment is redacted.
[[path_secrets]]
name = "discord-webhook"
pattern = '''/api/(?:v[0-9]+/)?webhooks/[0-9]+/(?P<secret>[^/?#\s"'`{}<>]+)'''

# HTTP authorization schemes: the credential after `Bearer`, `bearer`, or
# `Basic` (for example in a header string `"Authorization: Bearer x"`). The
# scheme word is kept.
[[path_secrets]]
name = "authorization-scheme"
pattern = '''(?:^|[^A-Za-z0-9_])(?i:bearer|basic)\s+(?P<secret>[A-Za-z0-9._~+/=-]+)'''

# Authorization headers with any scheme (`Token`, `Bot`, `Digest`, ...): the
# credential after the scheme word that follows a header name such as
# `Authorization: Token x`, `"Authorization": "token x"`, or
# `-HAuthorization=Bot x`, matched case-insensitively and anywhere in the
# text (so `Proxy-Authorization` and `-HAuthorization` count). The header
# name and scheme word are kept.
[[path_secrets]]
name = "authorization-header"
pattern = '''(?i:authorization)["'`]?[ \t]*[:=][ \t]*["'`]?[A-Za-z][A-Za-z0-9_-]*[ \t]+(?P<secret>[^\s"'`{}<>]+)'''
