# Fixed caveats. A caveat names a known uncovered route. It is printed in
# the JSON `caveats` list and the text report whenever a file of one of its
# languages is in the scanned tree, and it never changes the completeness state
# or the exit code.

[[caveat]]
id = "browser-dom"
languages = ["javascript"]
text = "Browser DOM-mediated requests are not covered: assigning src, href, or action on elements, and form submission."

# Fires when a parsed go.mod or go.work `go` directive names a release
# newer than the supported range's upper bound, not on language presence.
[[caveat]]
id = "go-version-newer-than-supported"
languages = ["go"]
go_newer_than = "1.26"
text = "A go.mod or go.work declares a Go release newer than the supported 1.18-1.26 range; files using newer syntax become parse errors."

# Fires when a Go package-level var supplies a resolved destination: the
# linker can rewrite it with -ldflags -X without a source change.
[[caveat]]
id = "go-var-ldflags"
languages = ["go"]
trigger = "go-var-ldflags"
text = "A Go package-level var supplied a resolved destination; a link-time -ldflags -X override can change it without a source change."

# Fires whenever a Python, JavaScript, or Rust source file is in the
# tree: filesystem reads and writes, FIFO and shared-memory creation,
# and anonymous pipes are inert and not counted (R26, KTD19).
[[caveat]]
id = "local-io"
languages = ["python", "javascript", "rust"]
text = "Filesystem reads and writes, FIFO and shared-memory creation, and anonymous pipes are not counted."
