# Fixed caveats. A caveat names a known uncovered route. It is printed in
# the JSON `caveats` list and the text report whenever a file of one of its
# languages is in the scanned tree, and it never changes the completeness state
# or the exit code.

[[caveat]]
id = "browser-dom"
languages = ["javascript"]
text = "Browser DOM-mediated requests are not covered: assigning src, href, or action on elements, and form submission."
