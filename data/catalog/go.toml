# Go egress catalog. A member matching neither an egress nor an inert
# pattern lists its module as an unscanned dependency. `package_name` is
# the package clause when the import path's last element cannot serve
# as the local name.

language = "go"

# The root path's package clause is `cloud`.
[[package]]
name = "cloud.google.com/go"
package_name = "cloud"
modules = [
    "cloud.google.com/go/compute/metadata",
    "cloud.google.com/go/storage",
]

# The root path's package clause is `sdk`.
[[package]]
name = "github.com/Azure/azure-sdk-for-go"
package_name = "sdk"
modules = [
    "github.com/Azure/azure-sdk-for-go/sdk/azcore",
    "github.com/Azure/azure-sdk-for-go/sdk/azidentity",
    "github.com/Azure/azure-sdk-for-go/sdk/storage/azblob",
]

[[package]]
name = "github.com/IBM/sarama"
modules = ["github.com/IBM/sarama"]

# The root path's package clause is `aws`.
[[package]]
name = "github.com/aws/aws-sdk-go-v2"
package_name = "aws"
modules = [
    "github.com/aws/aws-sdk-go-v2/config",
    "github.com/aws/aws-sdk-go-v2/service/*",
]

[[package]]
name = "github.com/ebitengine/purego"
modules = ["github.com/ebitengine/purego"]

[[package]]
name = "github.com/go-resty/resty"
modules = ["github.com/go-resty/resty", "github.com/go-resty/resty/v2"]

[[package]]
name = "github.com/go-sql-driver/mysql"
modules = ["github.com/go-sql-driver/mysql"]

[[package]]
name = "github.com/jackc/pgx"
modules = [
    "github.com/jackc/pgx",
    "github.com/jackc/pgx/v5",
    "github.com/jackc/pgx/v5/pgconn",
    "github.com/jackc/pgx/v5/pgxpool",
]

[[package]]
name = "github.com/lib/pq"
modules = ["github.com/lib/pq"]

[[package]]
name = "github.com/miekg/dns"
modules = ["github.com/miekg/dns"]

# The import path ends in `.go`; the package clause is `nats`.
[[package]]
name = "github.com/nats-io/nats.go"
modules = ["github.com/nats-io/nats.go"]
package_name = "nats"

# The import path ends in `-go`; the package clause is `amqp091`.
[[package]]
name = "github.com/rabbitmq/amqp091-go"
modules = ["github.com/rabbitmq/amqp091-go"]
package_name = "amqp091"

[[package]]
name = "github.com/redis/go-redis"
modules = ["github.com/redis/go-redis", "github.com/redis/go-redis/v9"]

# The import path ends in `-go`; the package clause is `kafka`.
[[package]]
name = "github.com/segmentio/kafka-go"
package_name = "kafka"
modules = ["github.com/segmentio/kafka-go"]

[[package]]
name = "github.com/valyala/fasthttp"
modules = ["github.com/valyala/fasthttp"]

# The root path holds no package; `driver` is the module's own clause
# convention (x/mongo/driver).
[[package]]
name = "go.mongodb.org/mongo-driver"
package_name = "driver"
modules = [
    "go.mongodb.org/mongo-driver/mongo",
    "go.mongodb.org/mongo-driver/mongo/options",
]

[[package]]
name = "golang.org/x/crypto"
modules = ["golang.org/x/crypto", "golang.org/x/crypto/ssh"]

[[package]]
name = "golang.org/x/net"
modules = [
    "golang.org/x/net",
    "golang.org/x/net/http2",
    "golang.org/x/net/proxy",
    "golang.org/x/net/websocket",
]

[[package]]
name = "golang.org/x/sys"
modules = [
    "golang.org/x/sys",
    "golang.org/x/sys/unix",
    "golang.org/x/sys/windows",
]

[[package]]
name = "google.golang.org/grpc"
modules = ["google.golang.org/grpc"]

