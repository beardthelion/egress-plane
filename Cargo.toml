[workspace]
resolver = "3"
members = [
    "crates/egress-core",
    "crates/egress-scan",
    "crates/egress-corpus",
    "crates/egress-python",
    "crates/egress-js",
    "crates/egress-rust",
    "crates/egress-cli",
]
# Fixture trees contain Cargo manifests and build scripts that are scan input,
# never workspace members.
exclude = ["fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Every external dependency is pinned to an exact version.
[workspace.dependencies]
egress-core = { path = "crates/egress-core" }
egress-scan = { path = "crates/egress-scan" }
egress-js = { path = "crates/egress-js" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.6"
