state = "complete"
exit_code = 0


[[layers]]
order = 1
family = "container"
kind = "docker"
evidence_classes = ["filesystem-marker", "kernel"]

[[routes]]
class = "escape"
kind = "hypervisor-device"
rule = "linux.dev.kvm"
member = "/dev/odd"

[[routes]]
class = "egress"
kind = "dns-resolver"
rule = "resolver.nameserver"
member = "nameserver 8.8.8.8"

