state = "complete"
exit_code = 0


[[layers]]
order = 1
family = "container"
kind = "docker"
evidence_classes = ["filesystem-marker", "kernel"]

[[routes]]
class = "egress"
kind = "agent-socket"
rule = "env.agent-socket"
member = "SSH_AUTH_SOCK"

[[routes]]
class = "escape"
kind = "runtime-endpoint-env"
rule = "env.runtime-endpoint"
member = "DOCKER_HOST"

[[routes]]
class = "egress"
kind = "agent-socket"
signal = "linux.socket.agent"
member = "/run/user/1000/gnupg/S.gpg-agent.ssh"

[[routes]]
class = "egress"
kind = "agent-socket"
signal = "linux.socket.agent"
member = "/run/user/1000/keyring/ssh"

[[routes]]
class = "egress"
kind = "dns-resolver"
rule = "resolver.nameserver"
member = "nameserver 8.8.8.8"


[[routes]]
class = "escape"
kind = "shared-pid-namespace"
signal = "linux.shared-pid-namespace"
member = "linux.shared-pid-namespace"
