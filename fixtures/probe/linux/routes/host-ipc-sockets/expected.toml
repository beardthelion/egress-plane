state = "complete"
exit_code = 0


[[layers]]
order = 1
family = "container"
kind = "docker"
evidence_classes = ["filesystem-marker", "kernel"]

[[routes]]
class = "escape"
kind = "host-ipc-socket"
signal = "linux.socket.host-ipc"
member = "/run/dbus/system_bus_socket"


[[routes]]
class = "escape"
kind = "host-ipc-socket"
signal = "linux.socket.host-ipc"
member = "/run/pcscd/pcscd.comm"


[[routes]]
class = "escape"
kind = "host-ipc-socket"
rule = "linux.socket.host-ipc"
member = "/tmp/.X11-unix/X0"

[[routes]]
class = "escape"
kind = "host-ipc-socket"
rule = "linux.socket.host-ipc"
member = "/run/user/1000/wayland-0"

[[routes]]
class = "escape"
kind = "host-ipc-socket"
rule = "linux.socket.host-ipc"
member = "@/tmp/.X11-unix/X0"

[[routes]]
class = "egress"
kind = "dns-resolver"
rule = "resolver.nameserver"
member = "nameserver 8.8.8.8"

[[inert]]
universe = "linux.capabilities"
rule = "linux.cap.default-container"
member = "cap_mknod"


[[routes]]
class = "escape"
kind = "shared-pid-namespace"
signal = "linux.shared-pid-namespace"
member = "linux.shared-pid-namespace"
