state = "complete"
exit_code = 0

absent_text = ["SENTINEL-bound-dir-file"]

[[layers]]
order = 1
family = "container"
kind = "docker"
evidence_classes = ["filesystem-marker", "kernel"]

[[routes]]
class = "escape"
kind = "runtime-socket"
rule = "linux.socket.runtime"
member = "/host/run/docker.sock"

[[routes]]
class = "egress"
kind = "dns-resolver"
rule = "resolver.nameserver"
member = "nameserver 8.8.8.8"

[[unclassified]]
universe = "linux.mounts"
member = "/host/run"

