state = "complete"
exit_code = 0

absent_routes = ["userns-creation-allowed"]

[[layers]]
order = 1
family = "container"
kind = "docker"
evidence_classes = ["filesystem-marker", "kernel"]

[[routes]]
class = "egress"
kind = "dns-resolver"
rule = "resolver.nameserver"
member = "nameserver 8.8.8.8"

[[attributes]]
layer = "docker"
name = "max_user_namespaces"
value = "15000"

[[attributes]]
layer = "docker"
name = "apparmor_restrict_unprivileged_userns"
value = "0"

