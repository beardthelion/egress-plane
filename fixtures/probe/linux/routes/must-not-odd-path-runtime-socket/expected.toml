state = "complete"
exit_code = 0

absent_routes = ["runtime-socket"]

[[layers]]
order = 1
family = "container"
kind = "docker"
evidence_classes = ["filesystem-marker", "kernel"]

[[routes]]
class = "egress"
kind = "host-ipc"
rule = "linux.mount.socket-bind"
member = "/opt/odd/ctl.sock"

[[routes]]
class = "escape"
kind = "writable-host-mount"
rule = "linux.mount.writable-host-bind"
member = "/opt/odd/ctl.sock"

[[routes]]
class = "egress"
kind = "dns-resolver"
rule = "resolver.nameserver"
member = "nameserver 8.8.8.8"

[[unclassified]]
universe = "linux.socket-files"
member = "/opt/odd/ctl.sock"

