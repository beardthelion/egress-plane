state = "complete"
exit_code = 0


[[layers]]
order = 1
family = "container"
kind = "docker"
evidence_classes = ["filesystem-marker", "kernel"]

[[routes]]
class = "escape"
kind = "writable-kernel-interface"
rule = "linux.mount.writable-cgroup"
member = "/sys/fs/cgroup"

[[routes]]
class = "escape"
kind = "writable-kernel-interface"
rule = "linux.mount.writable-sysfs-or-proc"
member = "/proc/sys/kernel/core_pattern"

[[routes]]
class = "egress"
kind = "dns-resolver"
rule = "resolver.nameserver"
member = "nameserver 8.8.8.8"

