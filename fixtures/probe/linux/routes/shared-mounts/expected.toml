state = "complete"
exit_code = 0


[[layers]]
order = 1
family = "container"
kind = "docker"
evidence_classes = ["filesystem-marker", "kernel"]

[[routes]]
class = "egress"
kind = "dns-resolver"
rule = "resolver.nameserver"
member = "nameserver 8.8.8.8"

[[routes]]
class = "egress"
kind = "shared-mount"
rule = "linux.mount.shared-fs"
member = "/mnt/nfs"

[[routes]]
class = "egress"
kind = "shared-mount"
rule = "linux.mount.shared-fs"
member = "/mnt/cifs"

[[routes]]
class = "egress"
kind = "shared-mount"
rule = "linux.mount.shared-fs"
member = "/mnt/virtio"

[[routes]]
class = "egress"
kind = "shared-mount"
rule = "linux.mount.shared-fs"
member = "/mnt/p9"

[[routes]]
class = "egress"
kind = "shared-mount"
rule = "linux.mount.shared-fs"
member = "/mnt/fuse"

