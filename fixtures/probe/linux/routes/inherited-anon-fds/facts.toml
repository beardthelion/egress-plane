platform = "linux"

[process]
state = "read"
pid = 4242

[env_names]
state = "read"
names = [
    { name = "PATH" },
    { name = "HOME" },
    { name = "HOSTNAME" },
]

[fds]
state = "read"
entries = [
    { fd = 0, target = "/dev/null" },
    { fd = 1, target = "pipe:[66001]" },
    { fd = 2, target = "pipe:[66001]" },
    { fd = 3, target = "/proc/4242/fd", probe_own = true },
    { fd = 5, target = "anon_inode:[io_uring]" },
    { fd = 6, target = "anon_inode:bpf-map" },
    { fd = 7, target = "anon_inode:[pidfd]" },
]

[landlock_abi]
state = "not-built"
