state = "complete"
exit_code = 0

absent_text = ["SENTINEL-token-contents", "SENTINEL-aws-secret"]

[[layers]]
order = 1
family = "container"
kind = "kubernetes"
evidence_classes = ["kernel"]

[[routes]]
class = "escape"
kind = "orchestrator-credential"
signal = "linux.cred.k8s-sa-token"
member = "/var/run/secrets/kubernetes.io/serviceaccount/token"

[[routes]]
class = "escape"
kind = "cloud-credential"
signal = "cred.aws-shared"
member = "/root/.aws/credentials"

[[routes]]
class = "egress"
kind = "dns-resolver"
rule = "resolver.nameserver"
member = "nameserver 8.8.8.8"

