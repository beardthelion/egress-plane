state = "incomplete"
exit_code = 2


[[layers]]
order = 1
family = "container"
kind = "docker"
evidence_classes = ["filesystem-marker", "kernel"]

[[routes]]
class = "egress"
kind = "dns-resolver"
rule = "resolver.nameserver"
member = "nameserver 8.8.8.8"

[[unknowns]]
source = "cred.aws-shared"
reason = "no-account-home"

[[unknowns]]
source = "cred.gcloud-adc"
reason = "no-account-home"

[[unknowns]]
source = "cred.azure-dir"
reason = "no-account-home"

[[unknowns]]
source = "cred.docker-config"
reason = "no-account-home"

[[unknowns]]
source = "cred.kubeconfig"
reason = "no-account-home"

[[unknowns]]
source = "cred.ssh-keys"
reason = "no-account-home"

[[unknowns]]
source = "proxy.config-files"
reason = "no-account-home"


[[routes]]
class = "escape"
kind = "shared-pid-namespace"
signal = "linux.shared-pid-namespace"
member = "linux.shared-pid-namespace"
