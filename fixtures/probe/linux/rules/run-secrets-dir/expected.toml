state = "complete"
exit_code = 0

absent_text = ["SENTINEL-db-password", "SENTINEL-ci-token"]

[[layers]]
order = 1
family = "container"
kind = "docker"
evidence_classes = ["filesystem-marker", "kernel"]

[[routes]]
class = "escape"
kind = "credential-file"
signal = "linux.cred.run-secrets"
member = "/run/secrets/db_password"

[[routes]]
class = "escape"
kind = "credential-file"
signal = "linux.cred.run-secrets"
member = "/run/secrets/api_token_glpat"

[[routes]]
class = "egress"
kind = "dns-resolver"
rule = "resolver.nameserver"
member = "nameserver 8.8.8.8"

