state = "complete"
exit_code = 0


[[layers]]
order = 1
family = "host"
kind = "unrecognized"

[[routes]]
class = "egress"
kind = "dns-resolver"
rule = "resolver.nameserver"
member = "nameserver 8.8.8.8"

[[routes]]
class = "egress"
kind = "network-interface"
rule = "linux.iface.non-loopback"
member = "eth0"

[[routes]]
class = "egress"
kind = "default-route"
rule = "route.any"
member = "0.0.0.0/0 via 192.168.1.1 dev eth0"

[[routes]]
class = "egress"
kind = "exposed-listener"
rule = "listener.exposed"
member = "tcp 0.0.0.0:22"

[[unclassified]]
universe = "linux.mounts"
member = "/"

[[unclassified]]
universe = "linux.mounts"
member = "/dev"

[[inert]]
universe = "linux.env-names"
rule = "env.ordinary"
member = "PATH"

