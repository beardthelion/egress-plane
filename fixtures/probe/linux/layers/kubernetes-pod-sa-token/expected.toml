state = "complete"
exit_code = 0

absent_text = ["SENTINEL-sa-token-eyJhbGci"]

[[layers]]
order = 1
family = "container"
kind = "kubernetes"
evidence_classes = ["filesystem-marker", "environment-name", "kernel", "resolver-config"]

[[routes]]
class = "escape"
kind = "orchestrator-credential"
signal = "linux.cred.k8s-sa-token"
member = "/var/run/secrets/kubernetes.io/serviceaccount/token"

[[routes]]
class = "escape"
kind = "credential-env"
rule = "env.credential"
member = "GITHUB_TOKEN"

[[routes]]
class = "egress"
kind = "dns-resolver"
rule = "resolver.nameserver"
member = "nameserver 10.96.0.10"

[[unclassified]]
universe = "linux.env-names"
member = "KUBERNETES_SERVICE_HOST"

[[inert]]
universe = "linux.mounts"
rule = "linux.mount.runtime-managed-files"
member = "/dev/termination-log"

[[inert]]
universe = "linux.resolvers"
rule = "resolver.directive"
member = "search default.svc.cluster.local"

