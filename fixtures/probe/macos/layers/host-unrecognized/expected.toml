state = "incomplete"
exit_code = 2

not_applicable = ["linux.unix-sockets", "linux.capabilities", "linux.devices", "linux.attr.status", "linux.attr.namespaces", "linux.attr.cgroup", "linux.attr.id-maps", "linux.attr.ptrace-scope", "linux.attr.landlock-abi"]

[[layers]]
order = 1
family = "host"
kind = "unrecognized"

[[routes]]
class = "egress"
kind = "dns-resolver"
rule = "resolver.nameserver"
member = "nameserver 192.168.64.1"

[[routes]]
class = "egress"
kind = "default-route"
rule = "route.any"
member = "0.0.0.0/0 via 192.168.64.1 dev en0"

[[unknowns]]
