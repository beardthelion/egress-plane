# Two sites in different languages share the destination env:WEBHOOK_URL, and
# each unscanned dependency is imported from two files. The text report groups
# the two sites under one destination heading and lists each dependency once.
state = "complete"
exit_code = 0
caveats = ["browser-dom"]

[[sites]]
file = "hooks/notify.py"
symbol = "notify"
mechanism = "python:requests.post"
destination = "env:WEBHOOK_URL"

[[sites]]
file = "web/src/notify.js"
symbol = "notify"
mechanism = "javascript:globalThis.fetch"
destination = "env:WEBHOOK_URL"

[[unscanned_dependencies]]
language = "python"
package = "yaml"

[[unscanned_dependencies]]
language = "javascript"
package = "lodash"
