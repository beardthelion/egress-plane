# Evasive spec matrix (KTD5). One [[row]] per planned case/twin pair.
#
# Fields: case (`<language>/evasive/<kebab-name>`), language, family
# (the code plan KTD15 vocabulary: dynamic-loading, reflective-access,
# scope-injection, import-system-mutation, introspection-roots,
# native-and-macro-code), label (kind, symbol, count, optional
# absent_text), twin (must-not- case id), axis (the one difference
# between case and twin), status (pending | authored |
# refused-by-safety-check), note (required when refused).
#
# Rows are labels first: the label is fixed before any source exists.
# The corpus guard requires an authored row's twin tree to share the
# case's file set and differ in at most one file and at most 3 lines.
# Every family has at least one row per applicable language; the first
# five families apply to python and javascript, native-and-macro-code
# applies to rust.
#
# Rows marked AE<n> seed a skipped code-plan acceptance case.

# ---- python: dynamic-loading ------------------------------------------------

[[row]]
case = "python/evasive/nonliteral-import"
language = "python"
family = "dynamic-loading"
label = { kind = "dynamic-import", symbol = "probe", count = 1 }
twin = "python/evasive/must-not-literal-import"
axis = "the __import__ specifier is a non-literal name vs a literal module name"
status = "authored"

[[row]]
case = "python/evasive/imported-module-reflective"
language = "python"
family = "dynamic-loading"
label = { kind = "dynamic-import", symbol = "probe", count = 1 }
twin = "python/evasive/must-not-literal-import-inert"
axis = "the __import__ specifier is a non-literal name vs a literal name of a wholly inert module"
status = "authored"
# AE3: getattr(__import__(name), "member")(u).

[[row]]
case = "python/evasive/dynamic-code-token"
language = "python"
family = "dynamic-loading"
label = { kind = "dynamic-code", symbol = "probe", count = 1, absent_text = ["ghp_placeholder_token"] }
twin = "python/evasive/must-not-token-in-comment"
axis = "the token-prefixed placeholder sits inside the dynamic-code argument vs only in a comment"
status = "authored"
# AE23: the construct text shows <redacted> where the placeholder stood.

