# Closure spec matrix (KTD5). Same row schema as evasive-spec.toml;
# `family` here is a code-plan KTD5 closure class: module-escape,
# value-use, constructor-return, ambient-module, untracked-receiver.
# module-escape, value-use, and constructor-return apply to all three
# languages; ambient-module and untracked-receiver apply to python and
# javascript.
#
# A closure case exercises one way a capability-bearing value reaches a
# use: a module object, an egress member as a value, the return of a
# reported site, the ambient module's members, or a receiver of
# untracked provenance.

# ---- python -------------------------------------------------------------------

[[row]]
case = "python/closure/module-as-value"
language = "python"
family = "module-escape"
label = { kind = "module-escape", symbol = "probe", count = 1 }
twin = "python/closure/must-not-inert-module-as-value"
axis = "the module used as a value holds a blind-spot entry vs is wholly inert"
status = "authored"

[[row]]
case = "python/closure/member-value-use"
language = "python"
family = "value-use"
label = { kind = "site", symbol = "probe", count = 1 }
twin = "python/closure/must-not-inert-member-use"
axis = "the value passed on is an egress member vs an inert member"
status = "authored"

[[row]]
case = "python/closure/default-arg-member"
language = "python"
