# Fixture cases that data entries name but that are not authored yet, and
# corpus categories that hold no case yet.
#
# - `cases` entries are `<lang>/<category>/<case>` fixture IDs.
# - `[[categories]]` entries are `{ id = "<lang>/<category>", reason = "..." }`
#   tables; the reason must be non-empty. The conformance test requires every
#   category to hold a case or appear here, and requires an entry to leave
#   once its category holds a case.
#
# This ledger must be empty at Definition of Done.
# The U9 curation names a per-entry fixture for each member row. The U11
# pass authored a representative band; the rest are breadth fixtures not
# yet authored. A subset also waits on tracking a method call on a value
# bound to an egress constructor call's result (for example the Conn and
# Channel methods reached through nats.Connect or amqp091.Dial), which is
# not resolved today.
cases = []

[[categories]]
id = "go/dependencies"
reason = "No Go module dependency root kind exists; --deps does not resolve Go imports."
