[package]
name = "egress-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Exact pins (KTD21). `span-locations` makes spans carry byte offsets outside
# a procedural macro; the `proc-macro` features stay off so proc-macro2 always
# uses its own fallback implementation.
[dependencies]
egress-core.workspace = true
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
syn = { version = "=3.0.6", default-features = false, features = ["full", "visit", "parsing", "printing", "clone-impls"] }

[dev-dependencies]
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
