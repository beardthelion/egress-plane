[package]
name = "egress-python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Astral publishes the parser family on crates.io as internal component
# crates, exact-pinned so a newer release never resolves silently. Bump
# only as its own change with the lockfile diff and the corpus green.
[dependencies]
egress-core.workspace = true
ruff_python_ast = "=0.0.15"
ruff_python_parser = "=0.0.15"
ruff_text_size = "=0.0.15"

[dev-dependencies]
egress-scan = { path = "../egress-scan" }
